<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -10 820 90" width="820" height="90" style="background-color: transparent;">
  <style>
    .label { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 13px; fill: #333; text-anchor: middle; dominant-baseline: central; }
    .orient { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 13px; fill: #999; text-anchor: middle; dominant-baseline: central; }
    .brace { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 11px; fill: #777; text-anchor: middle; }
    .legend { font-family: "trebuchet ms", verdana, sans-serif; font-size: 10px; fill: #555; dominant-baseline: central; }
  </style>

  <!-- 5' label -->
  <text x="14" y="36" class="orient">5&#x2032;</text>

  <!-- Start adapter -->
  <rect x="30" y="20" width="130" height="32" rx="2" fill="#f5d9a8" stroke="#c4963c" stroke-width="1"/>
  <text x="95" y="36" class="label">start adapter</text>

  <!-- R1 insert -->
  <rect x="164" y="20" width="130" height="32" rx="2" fill="#a8d8ea" stroke="#4a90c4" stroke-width="1"/>
  <text x="229" y="36" class="label">R1 insert</text>

  <!-- Hairpin adapter brace -->
  <line x1="298" y1="10" x2="492" y2="10" stroke="#777" stroke-width="0.8"/>
  <line x1="298" y1="10" x2="298" y2="16" stroke="#777" stroke-width="0.8"/>
  <line x1="492" y1="10" x2="492" y2="16" stroke="#777" stroke-width="0.8"/>
  <text x="395" y="6" class="brace">hairpin adapter</text>

  <!-- SID -->
  <rect x="298" y="20" width="46" height="32" rx="2" fill="#c8dab5" stroke="#7a9a5a" stroke-width="1"/>
  <text x="321" y="36" class="label">SID</text>

  <!-- Loop -->
  <rect x="348" y="20" width="84" height="32" rx="2" fill="#ECECFF" stroke="#9370DB" stroke-width="1"/>
  <text x="390" y="36" class="label">loop</text>

  <!-- SID RC -->
  <rect x="436" y="20" width="56" height="32" rx="2" fill="#c8dab5" stroke="#7a9a5a" stroke-width="1"/>
  <text x="464" y="36" class="label">SID RC</text>

  <!-- R2 insert -->
  <rect x="496" y="20" width="130" height="32" rx="2" fill="#a8d8ea" stroke="#4a90c4" stroke-width="1"/>
  <text x="561" y="36" class="label">R2 insert</text>

  <!-- End adapter -->
  <rect x="630" y="20" width="140" height="32" rx="2" fill="#f5d9a8" stroke="#c4963c" stroke-width="1"/>
  <text x="700" y="36" class="label">end adapter</text>

  <!-- 3' label -->
  <text x="790" y="36" class="orient">3&#x2032;</text>

  <!-- Legend -->
  <rect x="30" y="62" width="12" height="10" rx="1" fill="#a8d8ea" stroke="#4a90c4" stroke-width="0.8"/>
  <text x="48" y="68" class="legend" text-anchor="start">DNA insert</text>
  <rect x="130" y="62" width="12" height="10" rx="1" fill="#c8dab5" stroke="#7a9a5a" stroke-width="0.8"/>
  <text x="148" y="68" class="legend" text-anchor="start">Sample ID</text>
  <rect x="220" y="62" width="12" height="10" rx="1" fill="#f5d9a8" stroke="#c4963c" stroke-width="0.8"/>
  <text x="238" y="68" class="legend" text-anchor="start">Adapter</text>
  <rect x="300" y="62" width="12" height="10" rx="1" fill="#ECECFF" stroke="#9370DB" stroke-width="0.8"/>
  <text x="318" y="68" class="legend" text-anchor="start">Loop</text>
</svg>
