<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 185" width="700" height="185" style="background-color: transparent;">
  <style>
    .heading { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 12px; font-weight: bold; fill: #333; dominant-baseline: central; }
    .mono { font-family: "Courier New", monospace; font-size: 13px; fill: #333; dominant-baseline: central; }
    .mono-dim { font-family: "Courier New", monospace; font-size: 13px; fill: #aaa; dominant-baseline: central; }
    .tag { font-family: "Courier New", monospace; font-size: 14px; font-weight: bold; dominant-baseline: central; }
    .annot { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 10px; fill: #777; text-anchor: middle; }
    .brace-label { font-family: "trebuchet ms", verdana, arial, sans-serif; font-size: 11px; text-anchor: middle; }
    .legend { font-family: "trebuchet ms", verdana, sans-serif; font-size: 10px; fill: #555; dominant-baseline: central; }
  </style>

  <!-- Column positions: each base is 18px wide, starting at x=110 -->
  <!-- Bases: C G A C G C - G T  (9 positions) -->

  <!-- Row labels -->
  <text x="10" y="28" class="heading">R1:</text>
  <text x="10" y="56" class="heading">R2:</text>
  <text x="10" y="84" class="heading">Consensus:</text>
  <text x="10" y="130" class="heading">YC tag:</text>

  <!-- R1: C G A C G C - G T -->
  <text x="110" y="28" class="mono">C</text>
  <text x="128" y="28" class="mono">G</text>
  <text x="146" y="28" class="mono">A</text>
  <text x="164" y="28" class="mono">C</text>
  <text x="182" y="28" class="mono">G</text>
  <text x="200" y="28" class="mono">C</text>
  <text x="218" y="28" class="mono-dim">-</text>
  <text x="236" y="28" class="mono">G</text>
  <text x="254" y="28" class="mono">T</text>

  <!-- R2: C T C C G C A - - -->
  <text x="110" y="56" class="mono">C</text>
  <text x="128" y="56" class="mono">T</text>
  <text x="146" y="56" class="mono">C</text>
  <text x="164" y="56" class="mono">C</text>
  <text x="182" y="56" class="mono">G</text>
  <text x="200" y="56" class="mono">C</text>
  <text x="218" y="56" class="mono">A</text>
  <text x="236" y="56" class="mono-dim">-</text>
  <text x="254" y="56" class="mono-dim">-</text>

  <!-- Consensus: C G A C G C A G T -->
  <text x="110" y="84" class="mono">C</text>
  <text x="128" y="84" class="mono">G</text>
  <text x="146" y="84" class="mono">A</text>
  <text x="164" y="84" class="mono">C</text>
  <text x="182" y="84" class="mono">G</text>
  <text x="200" y="84" class="mono">C</text>
  <text x="218" y="84" class="mono">A</text>
  <text x="236" y="84" class="mono">G</text>
  <text x="254" y="84" class="mono">T</text>

  <!-- Shading: duplex overlap (positions 1-7, x=101 to x=227) -->
  <rect x="101" y="14" width="126" height="80" rx="3" fill="#a8d8ea" fill-opacity="0.15" stroke="#4a90c4" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Shading: right tail (positions 8-9, x=227 to x=263) -->
  <rect x="227" y="14" width="36" height="80" rx="3" fill="#ffeeba" fill-opacity="0.3" stroke="#c4963c" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- YC tag: +1KM3L+2 -->
  <text x="110" y="130" class="tag" fill="#333">+</text>
  <text x="128" y="130" class="tag" fill="#4a90c4">1</text>
  <text x="146" y="130" class="tag" fill="#c0392b">K</text>
  <text x="164" y="130" class="tag" fill="#c0392b">M</text>
  <text x="182" y="130" class="tag" fill="#4a90c4">3</text>
  <text x="218" y="130" class="tag" fill="#c0392b">L</text>
  <text x="236" y="130" class="tag" fill="#333">+</text>
  <text x="254" y="130" class="tag" fill="#c4963c">2</text>

  <!-- Annotations under YC tag -->
  <text x="110" y="150" class="annot">delim</text>
  <text x="182" y="150" class="annot" fill="#4a90c4">concordant</text>
  <text x="155" y="165" class="annot" fill="#c0392b">discordant</text>
  <text x="236" y="150" class="annot">delim</text>
  <text x="254" y="150" class="annot" fill="#c4963c">tail</text>

  <!-- Legend -->
  <rect x="340" y="22" width="12" height="10" rx="1" fill="#a8d8ea" fill-opacity="0.3" stroke="#4a90c4" stroke-width="0.8"/>
  <text x="358" y="28" class="legend" text-anchor="start">Duplex overlap (both strands)</text>
  <rect x="340" y="42" width="12" height="10" rx="1" fill="#ffeeba" fill-opacity="0.5" stroke="#c4963c" stroke-width="0.8"/>
  <text x="358" y="48" class="legend" text-anchor="start">Simplex tail (one strand only)</text>

  <text x="340" y="76" class="legend" text-anchor="start">
    <tspan x="340" dy="0" fill="#4a90c4" font-weight="bold">1, 3</tspan>
    <tspan> = concordant base count</tspan>
  </text>
  <text x="340" y="92" class="legend" text-anchor="start">
    <tspan x="340" dy="0" fill="#c0392b" font-weight="bold">K, M, L</tspan>
    <tspan> = discordant base codes</tspan>
  </text>
  <text x="340" y="108" class="legend" text-anchor="start">
    <tspan x="340" dy="0" font-weight="bold">+</tspan>
    <tspan> = delimiter (R1 contributed tail)</tspan>
  </text>
  <text x="340" y="124" class="legend" text-anchor="start">
    <tspan x="340" dy="0" fill="#c4963c" font-weight="bold">2</tspan>
    <tspan> = simplex tail base count</tspan>
  </text>
</svg>
